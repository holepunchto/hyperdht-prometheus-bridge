name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: npm run test
      - run: npm run integration
      - run: npm run test:bare
      - run: npm run integration:bare
